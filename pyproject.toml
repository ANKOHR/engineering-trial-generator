[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-trial-generator"
version = "1.0.0"
description = "Generate evidence-mapped, checkable paid engineering trial definitions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
engineering-trial-generator = "engineering_trial_generator.cli:main"

[tool.setuptools]
packages = ["engineering_trial_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
